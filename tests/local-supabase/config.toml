project_id = "tll-local-integration"
[api]
enabled = true
port = 55521
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[api.tls]
enabled = true
[db]
port = 55522
shadow_port = 55520
major_version = 17
health_timeout = "3m"
[db.pooler]
enabled = false
port = 55529
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
port = 55523
[local_smtp]
enabled = true
port = 55524
[storage]
enabled = true
file_size_limit = "5MiB"
[storage.s3_protocol]
enabled = false
[storage.analytics]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:55530"
additional_redirect_urls = ["http://127.0.0.1:55530/auth/callback"]
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1s"
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
[auth.sms]
enable_signup = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
